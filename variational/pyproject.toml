[project]
name = "bfss"
version = "0.6"
description = "Analytic variational construction for the SU(2) BFSS model: companion program"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "python-flint>=0.7",
    "threadpoolctl>=3.5",
]

[project.scripts]
bfss = "bfss.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bfss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exhaustive checks (oracles, long identities, the published state); run with --slow"]
